# Robot profile of the custom mobile manipulator for the MuJoCo plant (MuJoCo plant spec Section 3.3).
# It references the robot's existing sources instead of copying them; tools/plant/generate_robot_model.py turns the
# URDF + this profile into robot.xml. B5 and F2 keep their own configs; test_profile_consistency ties them together.
robot: mobile_manipulator
urdf: mobile_manipulator_description/urdf/mobile_manipulator.urdf          # package-relative
payload_json: mobile_manipulator_control/config/qualified_payload.json    # payload box, mass, qualified poses
model: robot.xml                                                          # generated, beside this file: the planar base
model_wheels: robot_wheels.xml                                            # generated: the base on its wheels
arm_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
# Static-torque limits (N m, null = none): F2's, checked equal by test_profile_consistency.
torque_limits_source: mobile_manipulator_medium/config/medium.yaml#torque_limits_nm
torque_limits_nm: [null, 96.0, 54.0, 24.0, 18.0, 12.0]

base:
  # Unity SkidSteerBaseController (docs/unity-skid-steer-base-controller.md): clamp, chassis rate limits, watchdog.
  limits: {v_max_fwd: 0.8, v_max_rev: 0.5, w_max: 0.8, accel: 0.5, decel: 0.8, yaw_accel: 0.8, yaw_decel: 1.2,
           stale_s: 0.5}
  # Breakaway from rest (Phase 5A Task 1 measurement; B5's nav_operating_envelope.yaml breakaway).
  # From rest the base stays until |v| or |omega| exceeds linear / yaw; it is at rest again below rest_*.
  breakaway: {linear_mps: 0.0375, yaw_radps: 0.07, rest_linear_mps: 0.01, rest_yaw_radps: 0.02}
  # Planar velocity servo on base_x / base_y / base_yaw (realistic mode, Task 6), force-limited by the wheels' torque:
  # Unity's four 20 N m wheel drives over the 0.14 m radius (571 N), times the 0.32 m half track for the yaw (183 N m).
  servo_kv: [20000.0, 20000.0, 6000.0]
  drive_force_limit_n: 571.4
  drive_torque_limit_nm: 182.9
  # The skid-steer mapping: wheel radius, effective track (yaw), the operating wheel-speed cap (common scaling; the
  # URDF's hard limit is 18 rad/s). On the wheels the effective track is measured in MuJoCo by
  # tools/plant/commission_plant.py (docs/experiments/mujoco-plant/commissioning.md).
  wheel_radius_m: 0.14
  effective_track_m: 2.5
  wheel_speed_max: 8.0
  # The wheel motors on the wheels base: a stiff velocity loop (N m s/rad), clamped at the URDF effort (85 N m)
  wheel_kv: 1000.0

arm:
  # Servo gains by rule (amendment Section 4): per joint kp = I w^2, kd = 2 zeta I w, I the joint-space inertia's
  # diagonal (armature included) at `pose`, w = 2 pi bandwidth_hz; the plant resolves them at reset. The bandwidth is
  # chosen at commissioning (docs/experiments/mujoco-plant/commissioning.md).
  gain_rule: {bandwidth_hz: 10.0, zeta: 1.0, pose: carry}
  # Rotor inertia through the gearbox (kg m^2): an assumption (see `assumptions`), checked at +-50 %.
  armature: [0.5, 0.5, 0.3, 0.1, 0.1, 0.1]
  # The URDF's joint damping (N m s/rad) and friction (N m); the servo's feedforward covers both.
  damping: [2.0, 2.2, 1.8, 0.9, 0.8, 0.6]
  frictionloss: [0.3, 0.25, 0.2, 0.12, 0.1, 0.08]
  gravity_ff: true
  motion_ff: true
  # the JTC's update rate (controllers.yaml) and the per-joint cap on the realized acceleration the motion feedforward
  # uses (Unity's ArmActuatorController.maximumReferenceAcceleration, the MoveIt joint limits; ADR 0014)
  jtc_rate_hz: 50.0
  ff_accel_limit: [2.0, 1.5, 2.0, 3.0, 3.0, 4.0]

lidar:
  site: livox_frame
  pattern: lidar/mid360.bin
  rate_hz: 10.0
  points_per_scan: 20000
  min_range_m: 0.1
  max_range_m: 70.0
  sigma_m: 0.02
  dropout: 0.0
  # sweep: each 2 ms step casts its slice from the sensor's pose then (a real Mid-360's motion distortion); instant: a
  # whole scan at once (Unity's IidNoiseRaycastLiDARSensor, no distortion)
  scan_mode: sweep
  # static geoms (site, scenario boxes, ground) through a bounding volume hierarchy, MuJoCo's rays for the robot, panel
  # and movers: the same hits for about half the cost (a margin choice, CP2: sweep scans 11.5 / 13.6 ms mean / p99
  # against 20.9 / 23.3 ms with MuJoCo's rays alone, both within the 25 ms rule); false: MuJoCo's rays for everything
  static_bvh: true

ideal:
  breakaway: false

realistic:
  # The URDF-based realistic mode (amendment 2026-11-06). The delays are the Task 7 measurement and fit
  # (docs/experiments/mujoco-plant/calibration.md); the planar-base values below are used only with base_model planar
  # (profile_unity.yaml holds the Unity-calibrated ones).
  base_model: wheels
  # The ground on the wheels base: friction (MuJoCo combines a pair by its larger coefficient: the ground and the
  # wheels both carry mu), the elliptic friction cone and its impedance ratio (the spike, 2026-11-06)
  contact: {mu: 0.6, impratio: 10.0}
  # transport and drive delays (spec 7.2): the command delays fitted; the base's state delay is the measured odometry
  # latency (/odom stamps against /clock), the arm's is fitted (Unity's raw joint states are not recorded)
  base_command_delay_s: 0.0
  arm_command_delay_s: 0.03
  base_state_delay_s: 0.0
  arm_state_delay_s: 0.0
  base_lag_s: [0.0, 0.0]
  base_slip: [1.0, 1.0]
  # Unity's base friction feedforward (Phase 5A) starts every command: no static breakaway in the realistic base
  base_breakaway: false
  # The skid map: achieved / commanded speed and yaw rate by the inner wheels' share |omega| (b_eff / 2) / |v|
  # (piecewise linear between the knots), and the yaw factor when turning in place
  base_skid:
    share: [0.0]
    v: [1.0]
    w: [1.0]
    w_in_place: 1.0

# The realistic mode's assumptions (amendment Section 2): what the URDF does not specify, with the source or reasoning
# and the range commissioning checks it over.
assumptions:
  ground_mu: {value: 0.6, source: "rubber tyre on concrete or compacted ground, typical 0.6-0.8", checked: [0.4, 0.8]}
  arm_armature: {value: [0.5, 0.5, 0.3, 0.1, 0.1, 0.1], source: "gear ratio^2 x rotor inertia for harmonic-drive joints (ratio 100-160, rotor 0.1-1e-4 kg m^2)", checked: "+-50 %"}
  arm_bandwidth_hz: {value: 10.0, source: "joint position loop of a geared arm; the highest stable value at commissioning", checked: [5.0, 15.0]}
  wheel_kv: {value: 1000.0, source: "a stiff, torque-limited wheel velocity loop (the spike: Unity's 20 cannot break the base free in turns)"}
  torque_speed: {value: flat, source: "no motor data; the URDF efforts at every speed"}

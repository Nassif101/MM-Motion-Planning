controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    arm_joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
arm_joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    use_local_topics: true
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    interfaces: [position, velocity]
arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_joint, wrist_1_joint, wrist_2_joint, wrist_3_joint]
    command_interfaces: [position, velocity]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    interpolate_from_desired_state: false
    allow_nonzero_velocity_at_trajectory_end: false
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 3.0
      shoulder_pan_joint: {trajectory: 0.15, goal: 0.04}
      shoulder_lift_joint: {trajectory: 0.15, goal: 0.04}
      elbow_joint: {trajectory: 0.15, goal: 0.04}
      wrist_1_joint: {trajectory: 0.15, goal: 0.04}
      wrist_2_joint: {trajectory: 0.15, goal: 0.04}
      wrist_3_joint: {trajectory: 0.15, goal: 0.04}

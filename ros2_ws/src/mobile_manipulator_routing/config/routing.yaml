# Engineering work budgets of the plant's route search; no wall-time throughput is implied.
# Since spec 2 Amendment 1 (2026-11-19) the search is the Smac Lattice 1.3.13 port. Its costs, tolerance,
# iteration limit, analytic expansion and smoother come from the Lattice block of
# mobile_manipulator_navigation/config/nav2_global_planning.yaml, and its costmap from that file's global costmap
# (footprint padding, inflation layer). They are not repeated here.
resolution_m: 0.05
expansions_per_tick: 256     # Smac iterations per 20 ms simulation tick
cell_tests_per_tick: 524288  # the validation pass's swept-footprint cell tests per tick
max_point_step_m: 0.0125     # the validation pass's sampling step
connector_radius_cells: 2    # the session's adoption connector, from the plant's pose to the route's start

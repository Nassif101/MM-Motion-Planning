map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""
    topic_name: map
    frame_id: map

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    costmap_update_timeout: 1.0
    # GridBased (NavFn) is a point planner: it sees the footprint only through the
    # inscribed-radius inflation and is retained as a baseline. Lattice checks the full
    # footprint polygon in SE(2) with differential-drive primitives, including in-place
    # rotation, and is the footprint-aware baseline for the non-circular panel footprint.
    planner_plugins: ["GridBased", "Lattice"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.20
      use_astar: true
      allow_unknown: false
    Lattice:
      plugin: "nav2_smac_planner::SmacPlannerLattice"
      # Empty path resolves to the installed 5 cm / 0.5 m diff-drive primitives
      # (the launch file fills it; the map resolution must stay 0.05 m).
      lattice_filepath: ""
      allow_unknown: false
      tolerance: 0.20
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      analytic_expansion_max_cost: 200.0
      analytic_expansion_max_cost_override: false
      reverse_penalty: 2.0
      change_penalty: 0.05
      # Straightness over inflation-cost avoidance: with cost_penalty 2.0 / non-straight
      # 1.05 the path S-bent 14 cm (16.8 deg) just before the 1.05 m gate (asymmetric
      # approach walls); 1.0 / 1.2 gives a straight, centred path (2026-09-28 sweep).
      non_straight_penalty: 1.2
      cost_penalty: 1.0
      rotation_penalty: 5.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: true
      allow_reverse_expansion: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true
        refinement_num: 2

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      transform_tolerance: 0.20
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.05
      rolling_window: false
      track_unknown_space: false
      # Default "home" profile from footprint_profiles.yaml; the launch file
      # substitutes another profile through its footprint_profile argument.
      footprint: "[[0.54, 0.62], [0.54, -0.62], [-0.70, -0.62], [-0.70, 0.62]]"
      footprint_padding: 0.01
      # global_obstacles:=true (navigation.launch.py) inserts obstacle_layer after static_layer.
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: true
        map_topic: /map
        map_subscribe_transient_local: true
        subscribe_to_updates: false
      # Unmapped obstacles for route-level replanning (roadmap scenarios 2 and 7). Same
      # sensor contract as the local costmap's STVL layer (test_local_costmap_config.py);
      # needs the Livox robot filter, which navigation.launch.py starts.
      obstacle_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_decay: 10.0
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        mark_threshold: 0
        update_footprint_enabled: true
        combination_method: 1
        origin_z: 0.0
        publish_voxel_map: false
        transform_tolerance: 0.20
        mapping_mode: false
        map_save_duration: 60.0
        observation_sources: livox_mark livox_clear
        livox_mark:
          data_type: PointCloud2
          topic: /livox/points_filtered
          marking: true
          clearing: false
          obstacle_range: 5.0
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          expected_update_rate: 0.5
          observation_persistence: 0.0
          inf_is_valid: false
          filter: "passthrough"
          voxel_min_points: 0
          clear_after_reading: true
        livox_clear:
          enabled: true
          data_type: PointCloud2
          topic: /livox/points_filtered
          marking: false
          clearing: true
          model_type: 1
          min_z: 1.5
          max_z: 6.0
          vertical_fov_angle: 0.2517
          vertical_fov_padding: 0.05
          horizontal_fov_angle: 6.29
          decay_acceleration: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        # At least the largest profile circumscribed radius plus padding (0.95 m).
        inflation_radius: 1.00
        cost_scaling_factor: 5.0
        inflate_unknown: false
        inflate_around_unknown: false
      always_send_full_costmap: true

lifecycle_manager_global_planning:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: ["map_server", "planner_server"]

# Rolling local costmap fed by the filtered Livox cloud. Follows the local-costmap
# perception contract in the design ledger. The same block is loaded by the standalone
# local_costmap.launch.py qualification harness and, later, by the controller server.
# The launch files substitute the footprint of the selected footprint profile.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      transform_tolerance: 0.20
      update_frequency: 10.0
      publish_frequency: 5.0
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: "[[0.54, 0.62], [0.54, -0.62], [-0.70, -0.62], [-0.70, 0.62]]"
      footprint_padding: 0.01
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        footprint_clearing_enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.125
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        combination_method: 1
        observation_sources: livox
        livox:
          topic: /livox/points_filtered
          data_type: "PointCloud2"
          marking: true
          clearing: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.15
          obstacle_max_range: 5.0
          raytrace_min_range: 0.15
          raytrace_max_range: 6.0
          observation_persistence: 0.0
          expected_update_rate: 0.3
          inf_is_valid: false
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.00
        cost_scaling_factor: 5.0

lifecycle_manager_local_costmap:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: ["local_costmap/local_costmap"]

# Nav2 command chain for Phase 1 navigation (ADR 0006), loaded by navigation.launch.py
# together with nav2_global_planning.yaml (map, planner, global costmap) and
# nav2_local_costmap.yaml (controller server's local costmap).
#
# Limits stay at or below config/nav_operating_envelope.yaml (checked by
# test/test_navigation_config.py). Collision-monitor polygons are generated per
# footprint profile by the launch file.

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    odom_topic: /odom
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    use_realtime_priority: false
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 10.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15
    # FollowPath is filled by the launch file from config/nav2_controllers.yaml
    # (controller:=rpp, dwb, or mppi).

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.3, 0.0, 0.4]
    min_velocity: [-0.3, 0.0, -0.4]
    max_accel: [0.45, 0.0, 0.8]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

collision_monitor:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    base_frame_id: base_footprint
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: ["StopZone", "SlowdownZone", "FootprintApproach"]
    # points are replaced by the launch file: footprint profile + margin. With
    # dynamic_monitor_zones:=true (B3 missions) the zones instead follow dynamic_polygon_topic,
    # which ReconfigurePanel publishes (profile + margin) whenever the footprint profile switches.
    StopZone:
      type: polygon
      points: "[[0.59, 0.67], [0.59, -0.67], [-0.75, -0.67], [-0.75, 0.67]]"
      margin_m: 0.05
      dynamic_polygon_topic: /collision_monitor/stop_zone_in
      action_type: stop
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor/stop_zone
      enabled: true
    SlowdownZone:
      type: polygon
      points: "[[0.84, 0.92], [0.84, -0.92], [-1.00, -0.92], [-1.00, 0.92]]"
      margin_m: 0.30
      dynamic_polygon_topic: /collision_monitor/slowdown_zone_in
      action_type: slowdown
      slowdown_ratio: 0.5
      min_points: 4
      visualize: true
      polygon_pub_topic: collision_monitor/slowdown_zone
      enabled: true
    # Projects the published footprint along the current command, including rotation,
    # so a sweeping corner of the 1.24 m footprint is caught before it reaches an obstacle.
    FootprintApproach:
      type: polygon
      action_type: approach
      footprint_topic: /local_costmap/published_footprint
      time_before_collision: 1.2
      simulation_time_step: 0.1
      min_points: 4
      visualize: false
      enabled: true
    observation_sources: ["livox"]
    livox:
      type: pointcloud
      topic: /livox/points_filtered
      min_height: 0.05
      max_height: 2.0
      enabled: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # Spin, BackUp and DriveOnHeading are not qualified with the payload footprint.
    behavior_plugins: ["wait"]
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    # The launch file fills the project behavior tree path.
    default_nav_to_pose_bt_xml: ""
    # Only NavigateToPose: the stock through-poses tree requires the unqualified Spin.
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 4.0
    node_names: ["controller_server", "behavior_server", "velocity_smoother",
                 "collision_monitor", "bt_navigator"]

# Deterministic navigation scenarios for tools/run_nav_scenario.py (roadmap Section 7.5).
#
# Poses are ROS map coordinates: [x m, y m, yaw rad]. The runner refuses to place the
# robot unless every map cell under the scenario's footprint profile at the start pose
# is free. arm_pose must be a qualified pose that scenario_place accepts, and
# footprint_profile must describe that pose.
#
# task: compute_path runs planner-only queries (global_planning.launch.py);
# navigate_to_pose drives one NavigateToPose goal with navigation.launch.py and needs
# timeout_s (simulated seconds). Goals must also be free for the footprint.
#
# obstacles (optional): unmapped boxes the runner places in Play after the teleport and
# removes after the run, as {name, x, y, size_x, size_y, height} in ROS map metres. They
# must lie in free map space and at least 0.3 m from the start and goal footprints.
scenarios:
  open_space:
    roadmap_scenario: 1
    description: Short open-area route with no obstacle within 6 m.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  narrow_gate_home:
    roadmap_scenario: 4
    description: 1.05 m manipulation gate with the conservative home footprint; expected to route around.
    arm_pose: home
    footprint_profile: home
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  narrow_gate_vertical_carry:
    roadmap_scenario: 5
    description: Same gate with the panel already in vertical carry; expected to pass through.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  open_space_nav:
    roadmap_scenario: 1
    description: Drive 4 m through open space with the home footprint.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 60
  narrow_gate_home_nav:
    roadmap_scenario: 4
    description: Drive past the 1.05 m gate with the home footprint; expected to take the detour.
    arm_pose: home
    footprint_profile: home
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: navigate_to_pose
    timeout_s: 180
  narrow_gate_vertical_carry_nav:
    roadmap_scenario: 5
    description: Drive through the 1.05 m gate with the panel already in vertical carry.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: navigate_to_pose
    timeout_s: 90
  # WideGate_1p30m: same design as the 1.05 m gate, 1.30 m opening, line at ROS x = -3,
  # opening y in [-16.65, -15.35]; same 3.0 m approach and 1.8 m exit as the narrow gate.
  wide_gate_home:
    roadmap_scenario: 4
    description: 1.30 m comparison gate with the home footprint (0.03 m per side).
    arm_pose: home
    footprint_profile: home
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  wide_gate_vertical_carry:
    roadmap_scenario: 5
    description: 1.30 m comparison gate in vertical carry (0.265 m per side).
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  wide_gate_home_nav:
    roadmap_scenario: 4
    description: Drive past the 1.30 m gate with the home footprint (0.03 m per side).
    arm_pose: home
    footprint_profile: home
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 180
  wide_gate_vertical_carry_nav:
    roadmap_scenario: 5
    description: Drive through the 1.30 m gate with the panel already in vertical carry.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 90
  # Open band x 5.2-18 m, |y| < 3 m (mapped walls cross it at x 2.0-2.2 and 4.8-5.1 m).
  static_obstacle_detour_nav:
    roadmap_scenario: 2
    description: Drive 8 m in open space past an unmapped 0.6 m box on the planned path.
    arm_pose: home
    footprint_profile: home
    start: [16.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    obstacles:
      - {name: detour_box, x: 12.0, y: 0.0, size_x: 0.6, size_y: 0.6, height: 0.8}
    task: navigate_to_pose
    timeout_s: 90
  # WideGate_1p30m opening (ROS y -16.65 to -15.35 at x = -3) filled by an unmapped box;
  # the planner's preferred route is blocked and only the longer detour remains.
  persistent_blockage_nav:
    roadmap_scenario: 7
    description: Vertical-carry route through the 1.30 m gate blocked by an unmapped box; the detour stays open.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    obstacles:
      - {name: gate_blocker, x: -3.0, y: -16.0, size_x: 0.3, size_y: 1.2, height: 1.0}
    task: navigate_to_pose
    timeout_s: 180

# Deterministic navigation scenarios for tools/run_nav_scenario.py (roadmap Section 7.5).
#
# Poses are ROS map coordinates: [x m, y m, yaw rad]. The runner refuses to place the
# robot unless every map cell under the scenario's footprint profile at the start pose
# is free. arm_pose must be a qualified pose that scenario_place accepts, and
# footprint_profile must describe that pose.
#
# task: compute_path runs planner-only queries (global_planning.launch.py);
# navigate_to_pose drives one NavigateToPose goal with navigation.launch.py and needs
# timeout_s (simulated seconds). Goals must also be free for the footprint.
#
# obstacles (optional): unmapped boxes the runner places in Play after the teleport and
# removes after the run, as {name, x, y, size_x, size_y, height} in ROS map metres. They
# must lie in free map space and at least 0.3 m from the start and goal footprints.
#
# movers (optional): boxes standing in for workers or carts, as {name, start: [x, y],
# end: [x, y], size_x, size_y, height, speed_mps, trigger_distance_m, crossings}. Each
# waits at start until the robot comes within trigger_distance_m of the segment midpoint,
# then walks to end at speed_mps (back and forth for more crossings) and stays at its last
# end. It waits while the robot is within 0.1 m of its next position. The walked area must
# be free map space; where it waits and where it stops must be at least 0.3 m from the
# start and goal footprints. Unity publishes their positions on /scenario/movers for the
# run metrics; navigation only sees them through the lidar.
scenarios:
  open_space:
    roadmap_scenario: 1
    description: Short open-area route with no obstacle within 6 m.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  narrow_gate_home:
    roadmap_scenario: 4
    description: 1.05 m manipulation gate with the conservative home footprint; expected to route around.
    arm_pose: home
    footprint_profile: home
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  narrow_gate_vertical_carry:
    roadmap_scenario: 5
    description: Same gate with the panel already in vertical carry; expected to pass through.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  open_space_nav:
    roadmap_scenario: 1
    description: Drive 4 m through open space with the home footprint.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 60
  narrow_gate_home_nav:
    roadmap_scenario: 4
    description: Drive past the 1.05 m gate with the home footprint; expected to take the detour.
    arm_pose: home
    footprint_profile: home
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: navigate_to_pose
    timeout_s: 180
  narrow_gate_vertical_carry_nav:
    roadmap_scenario: 5
    description: Drive through the 1.05 m gate with the panel already in vertical carry.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [-4.2, -7.725, 3.141593]
    goal: [-9.0, -7.725, 3.141593]
    task: navigate_to_pose
    timeout_s: 90
  # WideGate_1p30m: same design as the 1.05 m gate, 1.30 m opening, line at ROS x = -3,
  # opening y in [-16.65, -15.35]; same 3.0 m approach and 1.8 m exit as the narrow gate.
  wide_gate_home:
    roadmap_scenario: 4
    description: 1.30 m comparison gate with the home footprint (0.03 m per side).
    arm_pose: home
    footprint_profile: home
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  wide_gate_vertical_carry:
    roadmap_scenario: 5
    description: 1.30 m comparison gate in vertical carry (0.265 m per side).
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: compute_path
    planners: [GridBased, Lattice]
  wide_gate_home_nav:
    roadmap_scenario: 4
    description: Drive past the 1.30 m gate with the home footprint (0.03 m per side).
    arm_pose: home
    footprint_profile: home
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 180
  wide_gate_vertical_carry_nav:
    roadmap_scenario: 5
    description: Drive through the 1.30 m gate with the panel already in vertical carry.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    task: navigate_to_pose
    timeout_s: 90
  # Open band x 5.2-18 m, |y| < 3 m (mapped walls cross it at x 2.0-2.2 and 4.8-5.1 m).
  static_obstacle_detour_nav:
    roadmap_scenario: 2
    description: Drive 8 m in open space past an unmapped 0.6 m box on the planned path.
    arm_pose: home
    footprint_profile: home
    start: [16.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    obstacles:
      - {name: detour_box, x: 12.0, y: 0.0, size_x: 0.6, size_y: 0.6, height: 0.8}
    task: navigate_to_pose
    timeout_s: 90
  # A worker crosses the route once, at x = 11 m (the open band again); the 2.5 m trigger
  # puts the worker on the route when the robot is about 1.6 m away.
  worker_crossing_nav:
    roadmap_scenario: 3
    description: Drive 8 m in open space while a worker crosses the route at 0.8 m/s.
    arm_pose: home
    footprint_profile: home
    start: [16.0, 0.0, 3.141593]
    goal: [8.0, 0.0, 3.141593]
    movers:
      - {name: crossing_worker, start: [11.0, 2.5], end: [11.0, -2.5], size_x: 0.5, size_y: 0.5,
         height: 1.8, speed_mps: 0.8, trigger_distance_m: 2.5, crossings: 1}
    task: navigate_to_pose
    timeout_s: 90
  # WideGate_1p30m opening (ROS y -16.65 to -15.35 at x = -3) filled by an unmapped box;
  # the planner's preferred route is blocked and only the longer detour remains.
  persistent_blockage_nav:
    roadmap_scenario: 7
    description: Vertical-carry route through the 1.30 m gate blocked by an unmapped box; the detour stays open.
    arm_pose: vertical_carry
    footprint_profile: vertical_carry
    start: [0.0, -16.0, 3.141593]
    goal: [-4.8, -16.0, 3.141593]
    obstacles:
      - {name: gate_blocker, x: -3.0, y: -16.0, size_x: 0.3, size_y: 1.2, height: 1.0}
    task: navigate_to_pose
    timeout_s: 180
  # ---- Phase 2 (B3) missions: Nav2 drives with MoveIt reconfigurations at standstill ----
  # task: mission runs `steps` in order with mission_scenario_task (navigation.launch.py with
  # the starting footprint_profile, plus manipulation.launch.py). A reconfigure step gives a
  # panel-pose goal (panel centre in base_footprint, from `panel_pose --pose NAME`) or a named
  # state, and the footprint profile Nav2 uses afterwards; `goal` is the last drive's pose and
  # timeout_s applies to each drive. Vertical-carry panel goals use +/-0.01 m and +/-0.01 rad:
  # the profile leaves 0.02 m around the panel (docs/experiments/moveit-arm).
  narrow_gate_mission:
    roadmap_scenario: 5
    description: Reconfigure to a vertical panel pose before the 1.05 m gate, drive through, restore home.
    arm_pose: home
    footprint_profile: home
    start: [-2.2, -7.725, 3.141593]
    goal: [-11.0, -7.725, 3.141593]
    task: mission
    timeout_s: 180
    steps:
      - navigate: [-4.2, -7.725, 3.141593]
      - reconfigure:
          panel_pose: {xyz: [-0.08, 0.225, 1.32], rpy: [-1.5707963267948966, 1.5707963267948966, 0.0]}
          position_tolerance: [0.01, 0.01, 0.01]
          orientation_tolerance: [0.01, 0.01, 0.01]
          footprint_profile: vertical_carry
      - navigate: [-9.0, -7.725, 3.141593]
      - reconfigure: {named_state: home, footprint_profile: home}
      - navigate: [-11.0, -7.725, 3.141593]
  wide_gate_mission:
    roadmap_scenario: 5
    description: Same mission at the 1.30 m comparison gate.
    arm_pose: home
    footprint_profile: home
    start: [2.0, -16.0, 3.141593]
    goal: [-6.8, -16.0, 3.141593]
    task: mission
    timeout_s: 180
    steps:
      - navigate: [0.0, -16.0, 3.141593]
      - reconfigure:
          panel_pose: {xyz: [-0.08, 0.225, 1.32], rpy: [-1.5707963267948966, 1.5707963267948966, 0.0]}
          position_tolerance: [0.01, 0.01, 0.01]
          orientation_tolerance: [0.01, 0.01, 0.01]
          footprint_profile: vertical_carry
      - navigate: [-4.8, -16.0, 3.141593]
      - reconfigure: {named_state: home, footprint_profile: home}
      - navigate: [-6.8, -16.0, 3.141593]
  # A tall box beside the start blocks the qualified straight transition through home
  # (transition_validity_check), so MoveIt must find another way to vertical carry.
  constrained_reconfiguration_mission:
    roadmap_scenario: 6
    description: Reconfigure beside a tall box that blocks the naive transition, drive 3 m, restore home.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [9.0, 0.0, 3.141593]
    obstacles:
      - {name: tall_box, x: 12.0, y: -0.92, size_x: 1.0, size_y: 0.4, height: 1.6, clearance_m: 0.05}
    task: mission
    timeout_s: 90
    steps:
      - reconfigure:
          panel_pose: {xyz: [-0.08, 0.225, 1.32], rpy: [-1.5707963267948966, 1.5707963267948966, 0.0]}
          position_tolerance: [0.01, 0.01, 0.01]
          orientation_tolerance: [0.01, 0.01, 0.01]
          footprint_profile: vertical_carry
      - navigate: [9.0, 0.0, 3.141593]
      - reconfigure: {named_state: home, footprint_profile: home}
  # Run with --scene-source octomap: a 0.18 m box 1.2 m from the start, below the 0.2 m
  # height and inside the 1.5 m range of the lidar's documented near-field blind zone. The
  # runner's octomap_box_check reports whether MoveIt's Octomap holds it.
  octomap_blind_zone_mission:
    roadmap_scenario: 6
    description: Reconfigure with a low box in the lidar's near-field blind zone (Octomap scene source), drive 3 m, restore home.
    arm_pose: home
    footprint_profile: home
    start: [12.0, 0.0, 3.141593]
    goal: [9.0, 0.0, 3.141593]
    obstacles:
      - {name: low_box, x: 11.2, y: -1.2, size_x: 0.4, size_y: 0.4, height: 0.18}
    task: mission
    timeout_s: 90
    steps:
      - reconfigure:
          panel_pose: {xyz: [-0.08, 0.225, 1.32], rpy: [-1.5707963267948966, 1.5707963267948966, 0.0]}
          position_tolerance: [0.01, 0.01, 0.01]
          orientation_tolerance: [0.01, 0.01, 0.01]
          footprint_profile: vertical_carry
      - navigate: [9.0, 0.0, 3.141593]
      - reconfigure: {named_state: home, footprint_profile: home}

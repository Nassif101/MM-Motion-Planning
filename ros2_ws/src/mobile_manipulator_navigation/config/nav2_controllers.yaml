# Phase 1 local controllers: the Regulated Pure Pursuit bring-up controller and the
# roadmap Section 8 baselines B1 (DWB) and B2 (Nav2 MPPI).
#
# navigation.launch.py loads the block named by its `controller` argument as the
# controller server's FollowPath plugin, so the behaviour tree, planner, costmaps,
# goal and progress checkers, velocity smoother, and collision monitor are identical
# for every controller. Values are stock Nav2 Jazzy settings except where this robot
# needs otherwise:
#   - velocity limits at or below config/nav_operating_envelope.yaml, forward only
#     (reversing is inside the envelope but not used by the RPP bring-up, so no
#     controller uses it); the velocity smoother enforces the envelope's accelerations
#     on every controller's commands;
#   - collision checking against the full footprint, not a circle (the footprint
#     profiles are 1.24 m rectangles);
#   - goal tolerances matching the controller server's goal checker.
# test/test_navigation_config.py checks these rules.
controllers:
  rpp:
    plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
    desired_linear_vel: 0.3
    lookahead_dist: 0.6
    min_lookahead_dist: 0.4
    max_lookahead_dist: 0.9
    lookahead_time: 1.5
    use_velocity_scaled_lookahead_dist: true
    rotate_to_heading_angular_vel: 0.4
    transform_tolerance: 0.2
    min_approach_linear_velocity: 0.05
    approach_velocity_scaling_dist: 0.6
    use_collision_detection: true
    max_allowed_time_to_collision_up_to_carrot: 1.5
    use_regulated_linear_velocity_scaling: true
    use_cost_regulated_linear_velocity_scaling: false
    regulated_linear_scaling_min_radius: 0.9
    regulated_linear_scaling_min_speed: 0.1
    use_fixed_curvature_lookahead: false
    use_rotate_to_heading: true
    rotate_to_heading_min_angle: 0.785
    max_angular_accel: 0.8
    allow_reversing: false
    max_robot_pose_search_dist: 10.0

  # B1: dynamic-window sampling. The standard generator samples every command reachable
  # within sim_time and rolls it out under the acceleration limits.
  dwb:
    plugin: "dwb_core::DWBLocalPlanner"
    debug_trajectory_details: false
    trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
    min_vel_x: 0.0
    max_vel_x: 0.3
    min_vel_y: 0.0
    max_vel_y: 0.0
    max_vel_theta: 0.4
    min_speed_xy: 0.0
    max_speed_xy: 0.3
    min_speed_theta: 0.0
    acc_lim_x: 0.45
    decel_lim_x: -0.5
    acc_lim_y: 0.0
    decel_lim_y: 0.0
    acc_lim_theta: 0.8
    decel_lim_theta: -1.0
    vx_samples: 20
    vy_samples: 1
    vtheta_samples: 20
    sim_time: 1.7
    linear_granularity: 0.05
    angular_granularity: 0.025
    transform_tolerance: 0.2
    short_circuit_trajectory_evaluation: true
    xy_goal_tolerance: 0.15
    trans_stopped_velocity: 0.25
    # ObstacleFootprint instead of the stock BaseObstacle, which scores only the cell
    # under the base origin.
    critics: ["RotateToGoal", "Oscillation", "ObstacleFootprint", "GoalAlign", "PathAlign",
              "PathDist", "GoalDist"]
    ObstacleFootprint:
      scale: 0.02
    PathAlign:
      scale: 32.0
      forward_point_distance: 0.1
    GoalAlign:
      scale: 24.0
      forward_point_distance: 0.1
    PathDist:
      scale: 32.0
    GoalDist:
      scale: 24.0
    RotateToGoal:
      scale: 32.0
      slowing_factor: 5.0
      lookahead_time: -1.0

  # B2: model-predictive path integral control. 2000 sampled control sequences over
  # 56 x 0.05 s = 2.8 s (0.84 m at 0.3 m/s); accelerations are enforced in the rollout,
  # which starts from the measured velocity.
  mppi:
    plugin: "nav2_mppi_controller::MPPIController"
    motion_model: "DiffDrive"
    time_steps: 56
    model_dt: 0.05
    batch_size: 2000
    iteration_count: 1
    temperature: 0.3
    gamma: 0.015
    vx_max: 0.3
    vx_min: 0.0
    vy_max: 0.0
    wz_max: 0.4
    # Forward acceleration stays at the stock 3.0: with the envelope's 0.45 the first
    # command from rest is at most two steps x 0.0225 m/s, the weighted sample average
    # was 0.014 m/s, and the base does not break away below 0.0375 m/s, so MPPI never
    # started (2026-09-28). The velocity smoother still limits the command to 0.45 m/s^2;
    # braking and yaw use the envelope.
    ax_max: 3.0
    ax_min: -0.5
    az_max: 0.8
    vx_std: 0.2
    wz_std: 0.4
    prune_distance: 1.7
    transform_tolerance: 0.2
    regenerate_noises: false
    visualize: false
    retry_attempt_limit: 1
    critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
              "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
    ConstraintCritic:
      enabled: true
      cost_power: 1
      cost_weight: 4.0
    # Full-footprint checks wherever the base could touch an obstacle (the costmap's
    # inflation radius exceeds every profile's circumscribed radius).
    CostCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.81
      critical_cost: 300.0
      consider_footprint: true
      collision_cost: 1000000.0
      near_goal_distance: 1.0
      trajectory_point_step: 2
    GoalCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 1.4
    GoalAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 3.0
      threshold_to_consider: 0.5
    PathAlignCritic:
      enabled: true
      cost_power: 1
      cost_weight: 14.0
      max_path_occupancy_ratio: 0.05
      trajectory_point_step: 4
      threshold_to_consider: 0.5
      offset_from_furthest: 20
      use_path_orientations: false
    PathFollowCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      offset_from_furthest: 5
      threshold_to_consider: 1.4
    PathAngleCritic:
      enabled: true
      cost_power: 1
      cost_weight: 2.0
      offset_from_furthest: 4
      threshold_to_consider: 0.5
      max_angle_to_furthest: 1.0
      mode: 0
    PreferForwardCritic:
      enabled: true
      cost_power: 1
      cost_weight: 5.0
      threshold_to_consider: 0.5

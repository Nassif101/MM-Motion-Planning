# B5 whole-body MPC formulation (mobile_manipulator_mpc/formulation.hpp). Base and arm limits are
# not here: they come from mobile_manipulator_navigation/config/nav_operating_envelope.yaml and the
# URDF (load_limits). Each weight w multiplies 0.5 * w * r^2 of its residual r, per stage.
horizon: 20   # stages (2 s at dt_s)
dt_s: 0.1
# Solver failures and missed deadlines in a row ridden out on the shifted previous plan before the
# MPC brakes and fails FollowPath, as time (ruling R27): ceil(fallback_s * rate_hz) cycles, 6 at
# 20 Hz and 15 at 50 Hz; host stalls of 0.3 to 0.4 s were measured in the arm qualification.
fallback_s: 0.3
weights:
  contour: 20.0
  # lag 20 -> 30, progress 10 -> 20 (ruling R25, 2026-10-12): with the lag reference on the tapered
  # progress speed, 20/10 left a perpendicular goal heading parked 0.153 m from the goal and
  # arrived at 0.063 m/s; 30/20 arrives at 0.058 m/s and parks 0.145 m away.
  lag: 30.0
  progress: 20.0
  heading: 2.0
  goal_heading: 5.0
  panel_position: 50.0
  panel_orientation: 20.0
  posture: 2.0
  effort_base: 0.1
  effort_arm: 0.5
  smooth_base: 5.0
  smooth_arm: 5.0
  slack: 100.0             # L1 weight of a collision row's slack
  slack_quadratic: 1000.0  # its quadratic weight
# Posture preference (spec Section 3, amended 2026-10-13). mode: blend (the recorded B5: the comfort
# pose, pulled towards vertical_carry by the tightness), comfort_only (the comfort pose alone; the
# tightness is still computed and logged) or none (no posture term). comfort_pose: home (the
# recorded B5) or carry (a bent pose; must be in qualified_payload.json poses_rad, the node refuses
# to start otherwise). The tightness probes the comfort pose. The node parameters posture_mode and
# comfort_pose (launch arguments of the same names) override these.
posture:
  mode: blend
  comfort_pose: home
solver:
  eps: 1.0e-3     # absolute and relative tolerance (constraint rows in metres: 1 mm)
  max_iter: 500   # per cycle (about 25 ms at 0.05 ms per iteration); more falls back to the shifted plan

# Phase 4B-C targeted live runs (plan Task 5): the installed configuration with every 4B-C switch (slack_entry 1000,
# bench ruling) and no arm stream lead.
horizon: 20
dt_s: 0.1
fallback_s: 0.3
arm_stream_lead_s: 0.0
weights:
  contour: 20.0
  lag: 30.0
  progress: 20.0
  heading: 2.0
  goal_heading: 5.0
  panel_position: 50.0
  panel_orientation: 20.0
  posture: 2.0
  effort_base: 0.1
  effort_arm: 0.5
  smooth_base: 5.0
  smooth_arm: 5.0
  slack: 100.0
  slack_quadratic: 1000.0
  slack_inside: 3000.0
  slack_entry: 1000.0
collision:
  base_margin_m: 0.12
  lidar_intrusion_m: 0.08
  self_rows: true
  self_pairs_per_stage: 2
  self_links:
  - forearm_link
  - shoulder_pan_link
  - upper_arm_link
  - wrist_1_link
  midstage_rows: true
blocked:
  detect_s: 1.0
  fail_s: 3.0
  clear_s: 0.5
  progress_m: 0.05
posture:
  mode: blend
  comfort_pose: carry
  tight_poses:
  - vertical_carry
  - vertical_carry_right
clearance:
  weight: 0.0
  target_m: 0.25
slack_gate: true
slack_gate_horizon_s: 1.0
slack_gate_resume_horizon_s: 2.0
slack_gate_resume_dwell_s: 0.2
slack_gate_tolerance_m: 0.005
solver:
  eps: 0.001
  max_iter: 500
  backend: hpipm
  warm_start: true
  deadline_cap: false
  publish_margin_s: 0.002
  hpipm:
    mode: balance
    max_iter: 50
    partial_condensing_blocks: 0
    warm_start: false
qp_iterations: 1
iter2_budget: 0.5
iter2_cost_tolerance: 0.01
rti_split: false
rti_max_deviation:
  base_m: 0.05
  yaw_rad: 0.05
  joint_rad: 0.05
stream_dense_s: 0.5
slack_gate_arm_tolerance_m: 0.0001
